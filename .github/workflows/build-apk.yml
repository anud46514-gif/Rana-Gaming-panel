name: Build RANA GAMING PANEL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-28" "build-tools;28.0.3"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.4.1'

      - run: unzip RANA_PANEL_DOWNLOAD.zip -d source

      - name: Build APK
        working-directory: source/RANA_GAMING_PANEL
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RANA-GAMING-PANEL-APK
          path: source/RANA_GAMING_PANEL/app/build/outputs/apk/debug/app-debug.apk
